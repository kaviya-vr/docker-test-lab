name: Docker Test Lab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run Docker test lab
        run: docker compose up --build --abort-on-container-exit --exit-code-from tester

      - name: Display generated test report
        if: always()
        run: |
          echo "Generated test reports:"
          ls -la reports/ || true
          cat reports/*.txt || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-report
          path: reports/

      - name: Clean up Docker environment
        if: always()
        run: docker compose down -v